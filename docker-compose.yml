services:
  postgres:
    image: postgres:16-alpine
    container_name: insurance_claims_portfolio_db
    environment:
      POSTGRES_USER: claims_user
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: claims_analytics
    ports:
      - "5435:5432"
    volumes:
      - claims_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims_user -d claims_analytics"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  claims_postgres_data:
