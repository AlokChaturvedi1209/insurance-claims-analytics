[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-claims-analytics"
version = "0.1.0"
description = "Standalone insurance claims operations analytics portfolio project"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1,<3", "numpy>=1.26,<3", "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.1,<4", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6", "matplotlib>=3.8,<4"]

[project.scripts]
claims-analytics = "insurance_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
